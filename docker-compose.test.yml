services:
    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: test
        ports:
            - "${TEST_MYSQL_PORT:-3306}:3306"

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --requirepass secret
        ports:
            - "${TEST_REDIS_PORT:-6379}:6379"

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: postgres
        ports:
            - "${TEST_PG_PORT:-5432}:5432"

    http-server:
        build:
            context: test/integration/servers/http-server
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "${TEST_HTTP_PORT:-8080}:8080"

    socket-server:
        build:
            context: test/integration/servers/socket-server
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "${TEST_SOCKET_TCP_PORT:-9001}:9001"
            - "${TEST_SOCKET_WS_PORT:-9002}:9002"

    rustfs:
        image: rustfs/rustfs:latest
        restart: unless-stopped
        environment:
            RUSTFS_ACCESS_KEY: rustfsadmin
            RUSTFS_SECRET_KEY: rustfsadmin
            RUSTFS_ADDRESS: :9000
        ports:
            - "${TEST_S3_PORT:-9000}:9000"

    git-server:
        build:
            context: test/integration/servers/git-server
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "${TEST_GIT_PORT:-8085}:80"

    mongodb:
        image: mongo:7
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: secret
        ports:
            - "${TEST_MONGO_PORT:-27017}:27017"
